<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" width="360" height="334" role="img">
<title>How many 1s it takes to override a 0</title>
<desc>With one 0 in the history the prediction after a 0 flips to 1 at 8 ones; with two 0s at 15; with three at 23; with four at 30.</desc>
<rect width="360" height="334" rx="12" fill="#1a1a19"/>
<text x="16.0" y="26.0" font-size="13" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#f0efec">The latest bit is a 0. The model predicts:</text>
<rect x="16.0" y="38.0" width="20.0" height="20.0" rx="6" fill="#3987e5" stroke="none" stroke-width="1.5"/>
<text x="26.0" y="51.8" font-size="12.0" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" fill="#ffffff">0</text>
<text x="42.0" y="53.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#c3c2b7">a 0</text>
<rect x="84.0" y="38.0" width="20.0" height="20.0" rx="6" fill="#d95926" stroke="none" stroke-width="1.5"/>
<text x="94.0" y="51.8" font-size="12.0" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" fill="#ffffff">1</text>
<text x="110.0" y="53.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#c3c2b7">a 1</text>
<text x="16.0" y="88.0" font-size="12.5" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#f0efec">one 0 so far</text>
<text x="344.0" y="88.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end" fill="#c3c2b7">flips at 8 ones</text>
<rect x="28.0" y="96.0" width="74.0" height="14.0" rx="4" fill="#3987e5" stroke="none" stroke-width="1.5"/>
<rect x="104.0" y="96.0" width="237.5" height="14.0" rx="4" fill="#d95926" stroke="none" stroke-width="1.5"/>
<text x="16.0" y="138.0" font-size="12.5" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#f0efec">two 0s so far</text>
<text x="344.0" y="138.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end" fill="#c3c2b7">flips at 15 ones</text>
<rect x="28.0" y="146.0" width="140.5" height="14.0" rx="4" fill="#3987e5" stroke="none" stroke-width="1.5"/>
<rect x="170.5" y="146.0" width="171.0" height="14.0" rx="4" fill="#d95926" stroke="none" stroke-width="1.5"/>
<text x="16.0" y="188.0" font-size="12.5" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#f0efec">three 0s so far</text>
<text x="344.0" y="188.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end" fill="#c3c2b7">flips at 23 ones</text>
<rect x="28.0" y="196.0" width="216.5" height="14.0" rx="4" fill="#3987e5" stroke="none" stroke-width="1.5"/>
<rect x="246.5" y="196.0" width="95.0" height="14.0" rx="4" fill="#d95926" stroke="none" stroke-width="1.5"/>
<text x="16.0" y="238.0" font-size="12.5" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#f0efec">four 0s so far</text>
<text x="344.0" y="238.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end" fill="#c3c2b7">flips at 30 ones</text>
<rect x="28.0" y="246.0" width="283.0" height="14.0" rx="4" fill="#3987e5" stroke="none" stroke-width="1.5"/>
<rect x="313.0" y="246.0" width="28.5" height="14.0" rx="4" fill="#d95926" stroke="none" stroke-width="1.5"/>
<line x1="28.0" y1="278.0" x2="341.5" y2="278.0" stroke="#5a5955" stroke-width="1.5" stroke-linecap="round"/>
<line x1="32.8" y1="278.0" x2="32.8" y2="283.0" stroke="#5a5955" stroke-width="1.5" stroke-linecap="round"/>
<text x="32.8" y="297.0" font-size="11.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#c3c2b7">0</text>
<line x1="108.8" y1="278.0" x2="108.8" y2="283.0" stroke="#5a5955" stroke-width="1.5" stroke-linecap="round"/>
<text x="108.8" y="297.0" font-size="11.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#c3c2b7">8</text>
<line x1="184.8" y1="278.0" x2="184.8" y2="283.0" stroke="#5a5955" stroke-width="1.5" stroke-linecap="round"/>
<text x="184.8" y="297.0" font-size="11.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#c3c2b7">16</text>
<line x1="260.8" y1="278.0" x2="260.8" y2="283.0" stroke="#5a5955" stroke-width="1.5" stroke-linecap="round"/>
<text x="260.8" y="297.0" font-size="11.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#c3c2b7">24</text>
<line x1="336.8" y1="278.0" x2="336.8" y2="283.0" stroke="#5a5955" stroke-width="1.5" stroke-linecap="round"/>
<text x="336.8" y="297.0" font-size="11.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#c3c2b7">32</text>
<text x="184.8" y="314.0" font-size="12" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#c3c2b7">number of 1s so far</text>
</svg>

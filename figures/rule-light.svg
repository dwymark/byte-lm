<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" role="img">
<title>The rule the model follows</title>
<desc>If the latest bit is 1, predict 1. If it is 0, predict 0 unless the 1s so far outnumber the 0s by more than 7.39 to 1, in which case predict 1.</desc>
<rect width="360" height="330" rx="12" fill="#fcfcfb"/>
<rect x="70.0" y="14.0" width="220.0" height="44.0" rx="10" fill="#f1f0ec" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="180.0" y="41.0" font-size="14" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#0b0b0b">What is the latest bit?</text>
<line x1="120.0" y1="58.0" x2="76.0" y2="92.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="76.0" y1="92.0" x2="76.0" y2="120.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<path d="M71.0 115.0 L76.0 122.0 L81.0 115.0" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64.0" y="84.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end" fill="#52514e">it is a 1</text>
<rect x="16.0" y="124.0" width="120.0" height="40.0" rx="10" fill="#f1f0ec" stroke="#eb6834" stroke-width="2"/>
<rect x="24.0" y="131.0" width="26.0" height="26.0" rx="6" fill="#eb6834" stroke="none" stroke-width="1.5"/>
<text x="37.0" y="148.9" font-size="15.6" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" fill="#ffffff">1</text>
<text x="58.0" y="149.0" font-size="13" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#0b0b0b">predict 1</text>
<line x1="240.0" y1="58.0" x2="252.0" y2="80.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<line x1="252.0" y1="80.0" x2="252.0" y2="120.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<path d="M247.0 115.0 L252.0 122.0 L257.0 115.0" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="264.0" y="100.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#52514e">it is a 0</text>
<rect x="160.0" y="124.0" width="184.0" height="76.0" rx="10" fill="#f1f0ec" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="252.0" y="146.0" font-size="13.5" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#0b0b0b">Do the 1s so far</text>
<text x="252.0" y="165.0" font-size="13.5" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#0b0b0b">outnumber the 0s by more</text>
<text x="252.0" y="184.0" font-size="13.5" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#0b0b0b">than 7.39 to 1?</text>
<line x1="204.0" y1="200.0" x2="204.0" y2="242.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<path d="M199.0 237.0 L204.0 244.0 L209.0 237.0" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="196.0" y="226.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end" fill="#52514e">no</text>
<line x1="300.0" y1="200.0" x2="300.0" y2="242.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<path d="M295.0 237.0 L300.0 244.0 L305.0 237.0" fill="none" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308.0" y="226.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#52514e">yes</text>
<rect x="118.0" y="246.0" width="120.0" height="40.0" rx="10" fill="#f1f0ec" stroke="#2a78d6" stroke-width="2"/>
<rect x="126.0" y="253.0" width="26.0" height="26.0" rx="6" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="139.0" y="270.9" font-size="15.6" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" fill="#ffffff">0</text>
<text x="160.0" y="271.0" font-size="13" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#0b0b0b">predict 0</text>
<rect x="246.0" y="246.0" width="98.0" height="40.0" rx="10" fill="#f1f0ec" stroke="#eb6834" stroke-width="2"/>
<rect x="254.0" y="253.0" width="26.0" height="26.0" rx="6" fill="#eb6834" stroke="none" stroke-width="1.5"/>
<text x="267.0" y="270.9" font-size="15.6" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle" fill="#ffffff">1</text>
<text x="288.0" y="271.0" font-size="13" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="start" fill="#0b0b0b">predict 1</text>
<text x="180.0" y="312.0" font-size="12.5" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#52514e">Whatever it predicts, it is 88% sure.</text>
</svg>

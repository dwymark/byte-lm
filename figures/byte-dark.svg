<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 574" width="360" height="574" role="img">
<title>The eight weights of the model</title>
<desc>The byte 0xBE written as eight bits, each bit labelled with the weight it stores.</desc>
